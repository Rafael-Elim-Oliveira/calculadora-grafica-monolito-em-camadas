services:
  postgres:
    image: postgres:16-alpine
    container_name: calculadora_grafica_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: calculadora
      POSTGRES_PASSWORD: calculadora
      POSTGRES_DB: calculadora_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data