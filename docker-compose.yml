services:
  postgres:
    image: postgres:16-alpine
    container_name: calculadora_grafica_db
    environment:
      POSTGRES_USER: calculadora
      POSTGRES_PASSWORD: calculadora
      POSTGRES_DB: calculadora_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U calculadora -d calculadora_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    build: .
    container_name: calculadora_grafica_api
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: calculadora
      DB_PASSWORD: calculadora
      DB_DATABASE: calculadora_db
    depends_on:
      postgres:
        condition: service_healthy
        
volumes:
    postgres_data: